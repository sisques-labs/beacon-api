name: Release

# TODO(rename-service): update image_name / ghcr_image_name below once this
# template becomes a real service (see scripts/rename-service.sh).
#
# TODO(trunk-based-ci-cd): pin this to @main once
# sisques-labs/workflows#72 and #73 merge — currently pinned to the pilot
# branch because bump_mode=promote doesn't exist on workflows@main yet.
#
# Trunk-based model: this never rebuilds from source. It promotes the exact
# image digest that already passed dev/pre (see trunk-ci-cd.yml's
# image_digest job output) to a versioned :X.Y.Z + :latest release — the
# bytes shipped to prod are byte-for-byte what was validated in pre.
# There is only one channel (stable): no develop/staging means no
# alpha/beta/rc anymore.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      source_digest:
        description: "Fully qualified digest to promote to prod (e.g. sisqueslabs/beacon-api@sha256:...) — copy this from the trunk-ci-cd.yml run's image_digest output for the commit you want to release"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: sisques-labs/workflows/.github/workflows/docker-release.yml@feat/trunk-based-ci-cd-01-pipeline
    with:
      image_name: sisqueslabs/beacon-api
      ghcr_image_name: ghcr.io/sisques-labs/beacon-api
      push_ghcr: true
      version: ${{ inputs.version }}
      release_type: stable
      bump_mode: promote
      source_digest: ${{ inputs.source_digest }}
      node_version: "22"
      # No rebuild happens under promote — the digest was already
      # lint/tested when trunk-ci-cd.yml originally built it.
      run_lint: false
      run_test: false
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: write
      packages: write
